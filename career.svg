  <text x="198" y="112" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="36" font-weight="700">5</text>
  <text x="198" y="136" text-anchor="middle" fill="#818CF8" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">ヶ月</text>

  <text x="326" y="112" text-anchor="middle" fill="#F8FAFC" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="36" font-weight="700">11</text>
  <text x="326" y="136" text-anchor="middle" fill="#A78BFA" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="13">日</text>

  <circle cx="430" cy="92" r="28" fill="none" stroke="#334155" stroke-width="6"/>
  <circle cx="430" cy="92" r="28" fill="none" stroke="url(#accent)" stroke-width="6" stroke-linecap="round" stroke-dasharray="78.60 175.93" transform="rotate(-90 430 92)"/>
  <text x="430" y="97" text-anchor="middle" fill="#E2E8F0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">1.4y</text>
